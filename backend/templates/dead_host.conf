{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

  access_log /home/container/data/logs/dead-host-{{ id }}_access.log standard;
  error_log /home/container/data/logs/dead-host-{{ id }}_error.log warn;

{{ advanced_config }}

{% if use_default_location %}
  location / {
{% include "_hsts.conf" %}
    return 404;
  }
{% endif %}

  # Custom
  include /home/container/data/nginx/custom/server_dead[.]conf;
}
{% endif %}
